<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing | Erik Martin</title>
<meta name="description" content="Everything Erik Martin has published, in one list: articles on this site, newsletter issues from Chapel Hill Rear View and Covered Dish, and pieces posted elsewhere on online community and history.">
<link rel="canonical" href="https://hueypriest.com/writing/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Erik Martin">
<meta property="og:url" content="https://hueypriest.com/writing/">
<meta property="og:title" content="Writing | Erik Martin">
<meta property="og:description" content="Everything Erik Martin has published, in one list.">
<meta property="og:image" content="https://hueypriest.com/avatar.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@hueypriest">

{{head}}

<script type="application/ld+json">
{{jsonld}}
</script>
</head>
<body>

{{header}}

<main id="main">
<div class="shell shell--narrow">

  <section class="pagehead">
    <div>
      <h1>writing</h1>
      <p>everything, in one list, newest first</p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="filters" data-filters hidden>
      <button type="button" data-show="all" aria-pressed="true">All ({{n_all}})</button>
      <button type="button" data-show="here" aria-pressed="false">On this site ({{n_here}})</button>
      <button type="button" data-show="newsletter" aria-pressed="false">Newsletters ({{n_newsletter}})</button>
      <button type="button" data-show="elsewhere" aria-pressed="false">Elsewhere ({{n_elsewhere}})</button>
    </div>

{{list}}

    <p class="tl-end">Pieces marked <span style="color:var(--red)">HERE</span> live on this site. The rest link out to where they were first published. Subscribe by <a class="textlink" href="/feed.xml">RSS</a> or <a class="textlink" href="/#newsletters">email</a>. Last updated <time datetime="{{build_date}}">{{build_date_long}}</time>.</p>
  </section>

</div>
</main>

{{footer}}

</body>
</html>
